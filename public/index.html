<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Generation Playground</title>
  <meta name="theme-color" content="#161b22">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toolbar" class="toolbar">
    <span id="syncStatus" class="sync-status sync-connecting">接続中…</span>
    <span id="syncClock" class="sync-clock">--:--:--</span>
    <details class="notification-settings">
      <summary>通知 <span id="pushState">確認中</span></summary>
      <div class="notification-panel">
        <p>生成完了・リトライ上限での停止を、この端末にプッシュ通知します。受け取りたい端末ごとに有効にしてください。</p>
        <p id="pushStatus" role="status">通知の設定を確認しています…</p>
        <div class="notification-actions">
          <button id="pushToggle" type="button" disabled>この端末の通知を有効にする</button>
          <button id="pushTest" type="button" hidden>テスト通知</button>
        </div>
      </div>
    </details>
  </div>
  <main>
    <section id="controls">
      <h2>Create a New Image</h2>
      <form id="generateForm">
        <label>
          Prompt
          <textarea name="prompt" id="prompt" rows="6" required placeholder="Enter your prompt here..."></textarea>
        </label>
        <div id="inputImagesSection">
          <div id="inputDropZone" class="input-drop-zone">
            <span id="inputDropHint">入力画像をドロップ・<label for="inputFileInput" class="file-link">ファイルを選択</label>・プロンプト欄に貼り付け（最大16枚・編集モードに切り替わります）</span>
            <input type="file" id="inputFileInput" accept="image/*" multiple style="display:none">
          </div>
          <div id="inputThumbnails" class="input-thumbnails"></div>
          <div class="synthid-option">
            <label class="checkbox-label" for="remove_synthid">
              <input type="checkbox" id="remove_synthid" disabled aria-describedby="synthidHint synthidStatus">
              編集前にSynthIDを除去する（実験的）
            </label>
            <p id="synthidHint">入力画像だけをローカルで処理します。細部が変わる場合があり、除去成功の自動判定は行いません。</p>
            <p id="synthidStatus" role="status">除去エンジンを確認中…</p>
          </div>
        </div>
        <div class="row">
          <label class="model-label">
            Model / 接続先
            <select name="model" id="model" aria-describedby="providerStatus">
              <optgroup label="CometAPI">
                <option value="gpt-image-2-all">gpt-image-2-all (CometAPI)</option>
                <option value="gpt-image-2.6-flare">gpt-image-2.6-flare (CometAPI)</option>
                <option value="gpt-image-2.6-sunburst">gpt-image-2.6-sunburst (CometAPI)</option>
                <option value="gpt-image-2.5-flare">gpt-image-2.5-flare (CometAPI)</option>
                <option value="gpt-image-2.5-sunburst">gpt-image-2.5-sunburst (CometAPI)</option>
                <option value="gpt-image-2">gpt-image-2 (CometAPI)</option>
                <option value="gpt-image-1.5">gpt-image-1.5 (CometAPI)</option>
                <option value="gpt-image-1">gpt-image-1 (CometAPI)</option>
                <option value="gpt-image-1-mini">gpt-image-1-mini (CometAPI)</option>
              </optgroup>
              <optgroup label="OpenAI公式">
                <option value="openai:gpt-image-2.6-flare">gpt-image-2.6-flare (OpenAI公式)</option>
                <option value="openai:gpt-image-2.6-sunburst">gpt-image-2.6-sunburst (OpenAI公式)</option>
                <option value="openai:gpt-image-2.5-flare">gpt-image-2.5-flare (OpenAI公式)</option>
                <option value="openai:gpt-image-2.5-sunburst">gpt-image-2.5-sunburst (OpenAI公式)</option>
                <option value="openai:gpt-image-2">gpt-image-2 (OpenAI公式)</option>
                <option value="openai:gpt-image-1.5">gpt-image-1.5 (OpenAI公式)</option>
                <option value="openai:gpt-image-1">gpt-image-1 (OpenAI公式)</option>
                <option value="openai:gpt-image-1-mini">gpt-image-1-mini (OpenAI公式)</option>
              </optgroup>
              <optgroup label="Nano Banana (Gemini API)">
                <option value="gemini-2.5-flash-image">Nano Banana (gemini-2.5-flash-image)</option>
                <option value="gemini-3.1-flash-image-preview">Nano Banana 2 (gemini-3.1-flash-image-preview)</option>
                <option value="gemini-3-pro-image-preview">Nano Banana Pro (gemini-3-pro-image-preview)</option>
              </optgroup>
            </select>
          </label>
          <label>
            Number of images
            <input type="number" name="n" id="n" min="1" max="10" value="1">
          </label>
        </div>
        <p id="providerStatus" class="provider-status" role="status">接続先の設定を確認中…</p>
        <div class="row">
          <div class="vis-group-wrap">
            向き
            <div class="size-vis-group" id="sizeOrientationGroup">
              <button type="button" class="vis-btn" data-value="auto" title="Auto">
                <span class="vis-shape-wrap"><span class="vis-auto-icon">auto</span></span>
              </button>
              <button type="button" class="vis-btn active" data-value="square" title="正方形 (1:1)">
                <span class="vis-shape-wrap"><span class="vis-shape" style="width:30px;height:30px"></span></span>
              </button>
              <button type="button" class="vis-btn" data-value="landscape" title="横">
                <span class="vis-shape-wrap"><span class="vis-shape" style="width:42px;height:26px"></span></span>
              </button>
              <button type="button" class="vis-btn" data-value="portrait" title="縦">
                <span class="vis-shape-wrap"><span class="vis-shape" style="width:24px;height:38px"></span></span>
              </button>
            </div>
            <input type="hidden" id="sizeOrientation" value="square">
          </div>
          <div class="vis-group-wrap" id="sizeRatioLabel" style="display:none">
            アスペクト比
            <div class="size-vis-group" id="sizeRatioGroup">
              <button type="button" class="vis-btn" data-value="5:4" title="5:4">
                <span class="vis-shape" data-lw="35" data-lh="28" style="width:35px;height:28px"></span>
                <span class="vis-btn-label">5:4</span>
              </button>
              <button type="button" class="vis-btn active" data-value="4:3" title="4:3">
                <span class="vis-shape" data-lw="36" data-lh="27" style="width:36px;height:27px"></span>
                <span class="vis-btn-label">4:3</span>
              </button>
              <button type="button" class="vis-btn" data-value="3:2" title="3:2">
                <span class="vis-shape" data-lw="36" data-lh="24" style="width:36px;height:24px"></span>
                <span class="vis-btn-label">3:2</span>
              </button>
              <button type="button" class="vis-btn" data-value="16:9" title="16:9">
                <span class="vis-shape" data-lw="40" data-lh="22" style="width:40px;height:22px"></span>
                <span class="vis-btn-label">16:9</span>
              </button>
              <button type="button" class="vis-btn" data-value="21:9" title="21:9">
                <span class="vis-shape" data-lw="42" data-lh="18" style="width:42px;height:18px"></span>
                <span class="vis-btn-label">21:9</span>
              </button>
              <button type="button" class="vis-btn" data-value="2:1" data-no-gemini title="2:1">
                <span class="vis-shape" data-lw="40" data-lh="20" style="width:40px;height:20px"></span>
                <span class="vis-btn-label">2:1</span>
              </button>
              <button type="button" class="vis-btn" data-value="3:1" data-no-gemini title="3:1">
                <span class="vis-shape" data-lw="42" data-lh="14" style="width:42px;height:14px"></span>
                <span class="vis-btn-label">3:1</span>
              </button>
            </div>
            <input type="hidden" id="sizeRatio" value="4:3">
          </div>
          <label id="sizeTierLabel">
            大きさ
            <select id="sizeTier">
              <option value="GIF256" data-gif-only hidden disabled>256px</option>
              <option value="GIF512" data-gif-only hidden disabled>512px</option>
              <option value="S" selected>S</option>
              <option value="M">M</option>
              <option value="L">L</option>
              <option value="XL">XL</option>
            </select>
            <span id="sizePreview" style="font-size:0.8em; opacity:0.7; margin-left:0.3em; white-space:nowrap"></span>
          </label>
          <label id="geminiImageSizeLabel" style="display:none">
            Image Size
            <select id="gemini_image_size">
              <option value="512">512</option>
              <option value="1K" selected>1K (default)</option>
              <option value="2K">2K</option>
              <option value="4K">4K</option>
            </select>
          </label>
          <label id="geminiTemperatureLabel" style="display:none">
            Temperature
            <div class="slider-row">
              <input type="range" id="gemini_temperature" min="0" max="2" step="0.1" value="1">
              <input type="number" id="gemini_temperature_num" min="0" max="2" step="0.1" value="1" class="slider-num">
            </div>
          </label>
          <label id="geminiTopPLabel" style="display:none">
            Top P
            <div class="slider-row">
              <input type="range" id="gemini_top_p" min="0" max="1" step="0.01" value="0.95">
              <input type="number" id="gemini_top_p_num" min="0" max="1" step="0.01" value="0.95" class="slider-num">
            </div>
          </label>
          <label id="geminiThinkingLevelLabel" style="display:none">
            Thinking level
            <select id="gemini_thinking_level">
              <option value="">Default</option>
              <option value="MINIMAL">Minimal</option>
              <option value="LOW">Low</option>
              <option value="MEDIUM">Medium</option>
              <option value="HIGH">High</option>
            </select>
          </label>
          <label id="geminiOutputFormatLabel" style="display:none">
            Output format
            <select id="gemini_output_format">
              <option value="IMAGE_ONLY">Images only</option>
              <option value="IMAGE_AND_TEXT">Images &amp; text</option>
            </select>
          </label>
          <label id="geminiGroundingWebLabel" class="checkbox-label" style="display:none">
            <input type="checkbox" id="gemini_grounding_web">
            Grounding with Google Search
          </label>
          <label id="geminiGroundingImageLabel" class="checkbox-label" style="display:none">
            <input type="checkbox" id="gemini_grounding_image">
            Image search
          </label>
          <label id="qualityLabel">
            Quality
            <select name="quality" id="quality">
              <option value="">Default</option>
              <option value="auto">Auto</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="xhigh" data-extended-quality hidden disabled>Extra high</option>
              <option value="max" data-extended-quality hidden disabled>Max</option>
            </select>
          </label>
          <label id="complexityLabel" style="display:none">
            Complexity
            <select id="complexity" aria-describedby="complexityHint">
              <option value="">Default (High)</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
            <small id="complexityHint">生成前の検討量。単純な編集はLow、複雑な構図はHigh。</small>
          </label>
          <label id="inputFidelityLabel">
            Input fidelity
            <select name="input_fidelity" id="input_fidelity">
              <option value="">Default</option>
              <option value="low">Low</option>
              <option value="high">High</option>
            </select>
          </label>
          <label id="backgroundLabel">
            Background
            <select name="background" id="background">
              <option value="">Default</option>
              <option value="opaque">Opaque</option>
              <option value="auto" data-transparency hidden disabled>Auto</option>
              <option value="transparent" data-transparency hidden disabled>Transparent</option>
            </select>
          </label>
          <label id="formatLabel">
            Format
            <select name="format" id="format">
              <option value="">Default (png)</option>
              <option value="jpeg">JPEG</option>
              <option value="webp">WebP</option>
              <option value="gif" data-image-26-only hidden disabled>Animated GIF</option>
              <option value="svg" data-image-26-only hidden disabled>SVG</option>
            </select>
          </label>
          <label id="compressionLabel">
            Compression (0–100)
            <input type="number" name="output_compression" id="output_compression" min="0" max="100" step="1" placeholder="auto">
          </label>
          <label id="moderationLabel">
            Moderation
            <select name="moderation" id="moderation">
              <option value="">Default (auto)</option>
              <option value="low">Low</option>
            </select>
          </label>
          <label id="frameCountLabel" style="display:none">
            GIF frames
            <input id="frame_count" type="number" min="2" max="16" step="1" value="9">
          </label>
          <label id="frameDurationLabel" style="display:none">
            Frame duration (ms)
            <input id="frame_duration_ms" type="number" min="20" max="2000" step="10" value="200">
          </label>
          <label id="svgModelLabel" style="display:none">
            SVG author model (optional)
            <input id="svg_model" type="text" placeholder="Default" aria-describedby="formatHint">
          </label>
          <label id="svgReasoningLabel" style="display:none">
            SVG author reasoning
            <select id="svg_reasoning">
              <option value="">Default</option>
              <option value="none">None</option>
              <option value="minimal">Minimal</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="xhigh">Extra high</option>
              <option value="max">Max</option>
            </select>
          </label>
        </div>
        <p id="formatHint" class="format-hint" hidden></p>
        <p id="priceEstimate" class="price-estimate"></p>
        <button id="generateButton" type="submit" title="Generate (Ctrl+Enter)" disabled>Generate</button>
      </form>
    </section>
    <section id="history">
      <div class="section-header">
        <h2>Generation History</h2>
        <div class="section-header-controls">
          <button id="favFilterBtn" class="fav-filter-btn" title="お気に入りのみ表示"><svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" style="vertical-align:-1px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> お気に入り</button>
          <div class="fit-toggle" id="fitToggle" aria-label="Image scaling">
            <button class="fit-btn" data-fit="cover" title="Cover (crop)">Cover</button>
            <button class="fit-btn" data-fit="contain" title="Contain (letterbox)">Contain</button>
          </div>
        </div>
      </div>
      <div id="historyList" data-fit="cover"></div>
    </section>
  </main>
  <!-- Lightbox overlay -->
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="画像を拡大表示">
    <button id="lightboxFullscreen" class="lightbox-fullscreen" aria-label="全画面表示"></button>
    <button id="lightboxClose" class="lightbox-close" aria-label="閉じる">&#x2715;</button>
    <img id="lightboxImg" class="lightbox-img" src="" alt="拡大画像">
  </div>

  <!-- Generation params popup -->
  <div id="paramsPopup" class="params-popup" role="dialog" aria-modal="true" aria-label="生成パラメータ">
    <div class="params-popup-panel">
      <button id="paramsPopupClose" class="params-popup-close" aria-label="閉じる">&#x2715;</button>
      <h3 class="params-popup-title">生成パラメータ</h3>
      <div id="paramsPopupPrompt" class="params-popup-prompt"></div>
      <div id="paramsPopupList" class="params-popup-list"></div>
      <div class="params-popup-actions">
        <button id="paramsPopupCopyPrompt" class="params-popup-btn" type="button">プロンプトをコピー</button>
        <button id="paramsPopupLoadPrompt" class="params-popup-btn" type="button">プロンプトのみロード</button>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
